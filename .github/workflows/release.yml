name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test
        run: python -m pytest
      - name: Build application
        run: pyinstaller --noconfirm --clean CodexAccountManager.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          iscc "/DAppVersion=$version" installer/installer.iss
      - name: Generate SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\CodexAccountManager-*-Setup-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CodexAccountManager-*-Setup-x64.exe
            release/SHA256SUMS.txt
