name: Build Windows Installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run tests
        run: python -m pytest
      - name: Build PyInstaller app
        run: pyinstaller --noconfirm --clean CodexAccountManager.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          iscc "/DAppVersion=$version" installer/installer.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CodexAccountManager-installer
          path: release/CodexAccountManager-*-Setup-x64.exe
